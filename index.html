<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Elsődleges meta címkék -->
<title>ipcalc - IP cím & alhálózat kalkulátor</title>
<meta name="description" content="Ingyenes IP és alhálózat kalkulátor Material Design 3 felülettel. Hálózati cím, host min, host max, broadcast, CIDR és bináris reprezentáció. Teljes offline működés.">
<meta name="keywords" content="IP kalkulátor, alhálózat kalkulátor, CIDR kalkulátor, subnetting, hálózat kalkulátor, IP alhálózat, ipcalc, netmask kalkulátor, MD3">
<meta name="author" content="ipcalc">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://ipcalc.tanczikm.hu/">

<!-- PWA & Caching -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b57d0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ipcalc">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="ipcalc - IP cím & alhálózat kalkulátor">
<meta property="og:description" content="IP alhálózat kalkulátor Material Design 3 felülettel, CIDR jelöléssel, bináris nézettel és offline támogatással.">
<meta property="og:url" content="https://ipcalc.tanczikm.hu/">
<meta property="og:image" content="icon.webp">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="ipcalc - IP cím & alhálózat kalkulátor">
<meta name="twitter:description" content="IP alhálózat kalkulátor Material Design 3 felülettel, CIDR jelöléssel, bináris nézettel és offline támogatással.">
<meta name="twitter:image" content="icon.webp">

<!-- Favicon -->
<link rel="icon" type="image/webp" href="icon.webp">
<link rel="shortcut icon" href="icon.webp">
<link rel="apple-touch-icon" href="icon.webp">

<!-- Betűtípusok és ikonok (Google Fonts + offline rendszerfont fallback) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Stílusok (Material Design 3 - tanczikmate/filedrop minta alapján) -->
<link rel="stylesheet" href="style.css">

<!-- Strukturált adat -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "ipcalc - IP cím & alhálózat kalkulátor",
  "description": "IP cím és alhálózat kalkulátor CIDR jelöléssel, bináris megjelenítéssel, alhálózat lebontással és teljes offline működéssel.",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "HUF" }
}
</script>
</head>
<body>

<!-- Toast / Értesítés (MD3) -->
<div id="toast" class="toast" role="status" aria-live="polite">
  <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
    <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/>
  </svg>
  <span id="toastMsg">Másolva!</span>
</div>

<div class="container">

  <!-- Fejléc (MD3 stílus) -->
  <header>
    <h1>
      <svg xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="32" fill="currentColor">
        <path d="M160-160v-200h160v80h120v-80h-80v-200h240v200h-80v80h120v-80h160v200H640v-80H520v80H440v-80H320v80H160Zm80-80h80v-40h-80v40Zm480 0h80v-40h-80v40ZM480-600h80v-40h-80v40Z"/>
      </svg>
      ipcalc
      <span class="badge">MD3</span>
    </h1>
    <div class="header-actions">
      <span class="status-badge" id="offlineStatus" title="Minden tartalom gyorsítótárazva az offline működéshez">
        <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 -960 960 960" width="16" fill="currentColor">
          <path d="M414-280 612-478l-56-56-142 142-58-58-56 56 114 114ZM260-160q-91 0-155.5-63T40-377q0-78 47-139t123-78q25-92 100-149t170-57q117 0 198.5 81.5T760-520q69 8 114.5 59.5T920-340q0 75-52.5 127.5T740-160H260Zm0-80h480q42 0 71-29t29-71q0-42-29-71t-71-29h-60v-80q0-83-58.5-141.5T480-720q-83 0-141.5 58.5T280-520h-20q-58 0-99 41t-41 99q0 58 41 99t99 41Zm220-260Z"/>
        </svg>
        Offline kész
      </span>
      <button class="btn-icon" id="themeBtn" title="Téma váltása" onclick="cycleTheme()" aria-label="Téma váltása">
        <!-- Ikon JS-ből dinamikusan töltve -->
      </button>
    </div>
  </header>

  <!-- Számítási űrlap kártya -->
  <section class="card form-card">
    <form id="calcForm">
      <div class="form-grid">
        <div class="field">
          <label for="host">Cím / CIDR</label>
          <input type="text" class="form-control" id="host" placeholder="192.168.0.1 vagy /24" value="192.168.0.1" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="mask1">Hálózati maszk</label>
          <input type="text" class="form-control" id="mask1" placeholder="24 vagy 255.255.255.0" value="24" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="mask2">2. maszk <span>(opcionális)</span></label>
          <input type="text" class="form-control" id="mask2" placeholder="al- / szuperhálózat" autocomplete="off" spellcheck="false">
        </div>
        <div class="calc-btn-wrap">
          <button type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
              <path d="m380-300 280-180-280-180v360Z"/>
            </svg>
            Számítás
          </button>
        </div>
      </div>

      <div class="presets-row">
        <span class="preset-title">Gyakori maszkok:</span>
        <button type="button" class="preset-chip" data-mask="24">/24 (254 host)</button>
        <button type="button" class="preset-chip" data-mask="26">/26 (62 host)</button>
        <button type="button" class="preset-chip" data-mask="28">/28 (14 host)</button>
        <button type="button" class="preset-chip" data-mask="30">/30 (2 host)</button>
        <button type="button" class="preset-chip" data-mask="16">/16 (65k host)</button>
        <button type="button" class="preset-chip" data-mask="8">/8 (16M host)</button>
      </div>
    </form>
  </section>

  <!-- Eredmények kártya -->
  <div id="results">
    <section class="files-card result-card">
      <div class="results-header">
        <span class="section-label">
          <svg xmlns="http://www.w3.org/2000/svg" height="22" viewBox="0 -960 960 960" width="22" fill="currentColor">
            <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm-40-360v-240h80v240h-80Zm0 160v-80h80v80h-80Z"/>
          </svg>
          Eredmény
        </span>
        <div class="btn-group">
          <button type="button" class="btn-toggle active" id="toggleBin" title="Bináris oszlop megjelenítése/elrejtése">
            <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
              <path d="m384-336 56 56-160 160-56-56 160-160Zm176 176v-80h240v80H560ZM280-600l160-160-56-56-160 160 56 56Zm280 40v-80h240v80H560Z"/>
            </svg>
            bináris
          </button>
        </div>
      </div>
      <div class="table-wrapper">
        <table id="resultTable"></table>
      </div>
      <div id="subnetSection" class="subnet-section" style="display:none"></div>
    </section>
  </div>

  <!-- Előzmények kártya -->
  <section id="historySection" class="card history-section" style="display:none">
    <div class="history-header">
      <span class="section-label">
        <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
          <path d="M480-80q-75 0-140.5-28.5t-114-77q-48.5-48.5-77-114T120-440h80q0 117 81.5 198.5T480-160q117 0 198.5-81.5T760-440q0-117-81.5-198.5T480-720h-6l62 62-56 58-160-160 160-160 56 58-62 62h6q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-440q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-80Zm-40-200v-200l140 82-40 68-100-60v110h-80Z"/>
        </svg>
        Előzmények
      </span>
      <button class="btn-icon" id="clearHistory" title="Előzmények törlése" aria-label="Előzmények törlése">
        <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
          <path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T760-120H280Zm480-600H280v520h480v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/>
        </svg>
      </button>
    </div>
    <div class="history-list" id="historyList"></div>
  </section>

  <!-- Alhálózat referencia táblázat kártya -->
  <section class="card cheat-section">
    <div class="card-header">
      <span class="section-label">
        <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
          <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h160v-160H200v160Zm240 0h160v-160H440v160Zm240 0h80v-160h-80v160ZM200-440h160v-160H200v160Zm240 0h160v-160H440v160Zm240 0h80v-160h-80v160ZM200-680h160v-80H200v80Zm240 0h160v-80H440v80Zm240 0h80v-80h-80v80Z"/>
        </svg>
        Alhálózat referencia
      </span>
      <button class="btn-icon" id="toggleCheat" onclick="toggleCheat()" title="Összecsukás / Kinyitás" aria-label="Összecsukás / Kinyitás">
        <!-- Ikon JS-ből töltve -->
      </button>
    </div>
    <div id="cheatBody" class="cheat-body">
      <div class="table-wrapper">
        <table id="cheatTable"></table>
      </div>
    </div>
  </section>

  <!-- Lábléc -->
  <footer class="footer-stats">
    ipcalc &bull; Material Design 3 felület &bull; Teljesen offline működés Service Workerrel &bull; <a href="https://github.com/tanczikmate/ipcalc" target="_blank" rel="noopener">GitHub</a>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
