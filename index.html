<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Elsődleges meta címkék -->
<title>IP cím & alhálózat kalkulátor</title>
<meta name="description" content="Ingyenes IP és alhálózat kalkulátor Material Design 3 felülettel. Hálózati cím, host min, host max, broadcast, CIDR és bináris reprezentáció. Teljes offline működés.">
<meta name="keywords" content="IP kalkulátor, alhálózat kalkulátor, CIDR kalkulátor, subnetting, hálózat kalkulátor, IP alhálózat, ipcalc, netmask kalkulátor">
<meta name="author" content="ipcalc">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://ipcalc.tanczikm.hu/">

<!-- PWA & Caching -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b57d0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ipcalc">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="IP cím & alhálózat kalkulátor">
<meta property="og:description" content="IP alhálózat kalkulátor Material Design 3 felülettel, CIDR jelöléssel, bináris nézettel és offline támogatással.">
<meta property="og:url" content="https://ipcalc.tanczikm.hu/">
<meta property="og:image" content="icon.webp">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="IP cím & alhálózat kalkulátor">
<meta name="twitter:description" content="IP alhálózat kalkulátor Material Design 3 felülettel, CIDR jelöléssel, bináris nézettel és offline támogatással.">
<meta name="twitter:image" content="icon.webp">

<!-- Favicon -->
<link rel="icon" type="image/webp" href="icon.webp">
<link rel="shortcut icon" href="icon.webp">
<link rel="apple-touch-icon" href="icon.webp">

<!-- Betűtípusok (Google Fonts + offline rendszerfont fallback) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Stílusok (Material Design 3 - tanczikmate/filedrop stílus alapján) -->
<link rel="stylesheet" href="style.css">

<!-- Strukturált adat -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "IP cím & alhálózat kalkulátor",
  "description": "IP cím és alhálózat kalkulátor CIDR jelöléssel, bináris megjelenítéssel, alhálózat lebontással és teljes offline működéssel.",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "HUF" }
}
</script>
</head>
<body>

<!-- Toast / Értesítés -->
<div id="toast" class="toast" role="status" aria-live="polite">
  <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 0 24 24" width="16" fill="currentColor">
    <path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
  </svg>
  <span id="toastMsg">Másolva!</span>
</div>

<div class="container">

  <!-- Fejléc -->
  <header>
    <h1>
      <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="currentColor">
        <path d="M13 22h8v-7h-3v-4h-4V7h2V3h-8v4h2v4H6v4H3v7h8v-7H9v-2h6v2h-2v7zM5 17h4v3H5v-3zm10 0h4v3h-4v-3zM9 5h2v2H9V5z"/>
      </svg>
      ipcalc
    </h1>
    <div class="header-actions">
      <button class="btn-icon" id="themeBtn" title="Téma váltása" onclick="cycleTheme()" aria-label="Téma váltása">
        <!-- Ikon dinamikusan betöltve -->
      </button>
    </div>
  </header>

  <!-- Számítási űrlap kártya -->
  <div class="form-card">
    <form id="calcForm">
      <div class="form-grid">
        <div class="field">
          <label for="host">Cím / CIDR</label>
          <input type="text" class="form-control" id="host" placeholder="192.168.0.1 vagy /24" value="192.168.0.1" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="mask1">Hálózati maszk</label>
          <input type="text" class="form-control" id="mask1" placeholder="24 vagy 255.255.255.0" value="24" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="mask2">2. maszk <span>(opcionális)</span></label>
          <input type="text" class="form-control" id="mask2" placeholder="al- / szuperhálózat" autocomplete="off" spellcheck="false">
        </div>
        <div class="calc-btn-wrap">
          <button type="submit" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            Számítás
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- Eredmények kártya -->
  <div id="results">
    <div class="result-card">
      <div class="results-header">
        <span class="section-label">
          <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 0 24 24" width="20" fill="currentColor">
            <path d="m17 16-4-4V8.82C14.16 8.4 15 7.3 15 6c0-1.66-1.34-3-3-3S9 4.34 9 6c0 1.3.84 2.4 2 2.82V12l-4 4H3v5h5v-3.05l4-4.2 4 4.2V21h5v-5h-4z"/>
          </svg>
          Eredmény
        </span>
        <div class="btn-group">
          <button type="button" class="btn-toggle active" id="toggleBin" title="Bináris oszlop megjelenítése/elrejtése">
            <svg xmlns="http://www.w3.org/2000/svg" height="15" viewBox="0 0 24 24" width="15" fill="currentColor">
              <path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
            </svg>
            bináris
          </button>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="rtable" id="resultTable"></table>
      </div>
      <div id="subnetSection" class="subnet-section" style="display:none"></div>
    </div>
  </div>

  <!-- Előzmények kártya -->
  <div id="historySection" class="history-section" style="display:none">
    <div class="history-header">
      <span class="section-label">
        <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18" fill="currentColor">
          <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7a6.97 6.97 0 0 1-4.95-2.05l-1.41 1.41C8.2 20.02 10.46 21 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
        </svg>
        Előzmények
      </span>
      <button class="btn-icon" id="clearHistory" title="Előzmények törlése" aria-label="Előzmények törlése">
        <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 0 24 24" width="16" fill="currentColor">
          <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5-1-1h-5l-1 1H5v2h14V4h-3.5z"/>
        </svg>
      </button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- Alhálózat referencia táblázat kártya -->
  <div class="cheat-section">
    <div class="card-header">
      <span class="section-label">
        <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18" fill="currentColor">
          <path d="M10 10.02h5V21h-5zM17 21h3c1.1 0 2-.9 2-2v-9h-5v11zm3-18H4c-1.1 0-2 .9-2 2v3h20V5c0-1.1-.9-2-2-2zM3 19c0 1.1.9 2 2 2h3V10H3v9z"/>
        </svg>
        Alhálózat referencia
      </span>
      <button class="btn-icon" id="toggleCheat" onclick="toggleCheat()" title="Összecsukás / Kinyitás" aria-label="Összecsukás / Kinyitás">
        <!-- Ikon dinamikusan betöltve -->
      </button>
    </div>
    <div id="cheatBody" class="cheat-body">
      <div class="table-wrapper">
        <table class="rtable" id="cheatTable"></table>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
